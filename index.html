<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
  <div class="brand-row">
    <span class="brand">calc / 01</span>
    <span class="mode" id="mode">DEG</span>
  </div>

  <div class="display">
    <div class="display-prev" id="displayPrev">&nbsp;</div>
    <div class="display-current" id="displayCurrent">0</div>
  </div>

  <div class="keys">
    <button class="clear" onclick="clearAll()">AC</button>
    <button class="clear" onclick="deleteLast()">DEL</button>
    <button class="op" onclick="chooseOperator('%')">%</button>
    <button class="op" onclick="chooseOperator('÷')">÷</button>

    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="op" onclick="chooseOperator('×')">×</button>

    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="op" onclick="chooseOperator('−')">−</button>

    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="op" onclick="chooseOperator('+')">+</button>

    <button class="span-2" onclick="appendNumber('0')">0</button>
    <button onclick="appendDecimal()">.</button>
    <button class="eq" onclick="calculate()">=</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
